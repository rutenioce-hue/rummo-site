<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUMMO: gestão estratégica</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: produto real, direto, calmo
   IDEA: a porta de entrada da RUMMO: escolhe a organização e cai no seu espaço, com as fases como uma trilha
   PICTURE: a trilha de fases, com o ponto coral na fase atual
   COLOUR and TYPE: azul RUMMO #0E359D dominante, branco, coral var(--dot,#D9F301) como destino; Anton só na logo; Montserrat em tudo, com escala clara de tamanhos e pesos
   LAYOUT: entrada em azul cheio; espaço da organização com trilha no topo e cartões de fase */
:root{color-scheme:light dark;--azul:#381A56;--azul-e:#2A1240;--coral:#D9F301;--acct:light-dark(#6B3FA0,#D9F301);--dot:#D9F301;--bg:light-dark(#FAF7F3,#150B20);--card:light-dark(#fff,#21132F);--ink:light-dark(#1F1230,#F3EEFA);--cinza:light-dark(#6B5F78,#B6A9C6);--linha:light-dark(#E8E0D6,#3A2A4C);--azul-c:light-dark(#EFE7F7,#2A1A3B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Montserrat,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.05;letter-spacing:-.025em}h2{font-size:clamp(28px,3.4vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.02em}h3{font-weight:700;letter-spacing:-.01em}
.eyebrow{display:inline-block;font-size:14px;font-weight:700;color:var(--acct);margin-bottom:12px}
body{font-weight:400}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}.in{max-width:1180px;margin:0 auto}
.top{background:var(--azul-e);color:#fff;padding:12px max(5vw,16px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top svg{width:110px;display:block}.top .sp{flex:1}
.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:8px 16px;min-height:40px;font:600 14px inherit;font-family:inherit;cursor:pointer}
button,.btn{font-family:inherit}
.entrar{background:var(--azul);color:#fff;min-height:calc(100vh - 64px);display:grid;align-items:center}
.entrar .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,70px);align-items:center}
.entrar .lock{width:min(100%,460px);display:block;margin-bottom:18px}
.entrar p.sub{font-size:19px;opacity:.9;max-width:34ch;margin:10px 0 0}
.box{background:var(--card);color:var(--ink);border-radius:26px;padding:26px;box-shadow:0 30px 60px rgba(30,10,50,.4)}
.box h3{margin:0 0 4px;font-size:20px}.box .cap{color:var(--cinza);font-size:14px;margin:0 0 16px}
.org{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--azul-c);color:var(--ink);border:2px solid transparent;border-radius:18px;padding:14px 16px;margin-top:10px;cursor:pointer;min-height:64px;font-size:16px}
.org:hover,.org:focus-visible{border-color:var(--acct);outline:none}
.av{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font:800 17px Montserrat,system-ui,sans-serif;color:#fff;background:var(--azul)}
.org b{display:block}.org small{color:var(--cinza)}
.nota{font-size:13px;color:var(--cinza);margin-top:16px;border-top:1px solid var(--linha);padding-top:12px}
.trilha{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:26px 0 8px;position:relative}
.trilha:before{content:"";position:absolute;left:10%;right:10%;top:15px;height:4px;border-radius:4px;background:var(--linha)}
.tp{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;font-size:13px;font-weight:700;color:var(--cinza)}
.tp i{width:34px;height:34px;border-radius:50%;background:var(--card);border:3px solid var(--linha);display:block}
.tp.on i{background:var(--azul);border-color:var(--azul)}.tp.on{color:var(--ink)}
.tp.agora i{background:var(--coral);border-color:var(--acct);box-shadow:0 0 0 6px color-mix(in srgb,var(--coral) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.tp.agora i{animation:pulsa 1.8s ease-in-out infinite}}
@keyframes pulsa{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--coral) 0%,transparent)}}
.fases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-top:24px}
.fase{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.fase .n{font:700 13px Montserrat,system-ui,sans-serif;color:var(--cinza)}
.fase h3{margin:0;font-size:20px}.fase p{margin:0;color:var(--cinza);font-size:15px}
.fase ul{margin:0;padding-left:18px;font-size:15px}
.pill{align-self:flex-start;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--azul-c);color:var(--azul)}
:root[data-theme=dark] .pill{color:#D9F301}
.pill.ok{background:var(--azul);color:#fff}.pill.vem{background:var(--coral);color:#381A56}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:800;text-decoration:none;border:0;cursor:pointer;font-size:15px}
.btn.p{background:var(--coral);color:#381A56}.btn.s{background:var(--azul-c);color:var(--azul)}
:root[data-theme=dark] .btn.s{color:#D9F301}
.fase .acts{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}
.fase.destaque{border:2px solid var(--azul)}
.cab{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cab .av{width:64px;height:64px;border-radius:20px;font-size:30px}
.cab p{margin:4px 0 0;color:var(--cinza)}
.aviso{margin-top:26px;background:var(--azul-c);border-radius:18px;padding:16px 18px;font-size:14px}
.tabs{display:flex;gap:6px;margin-top:22px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.tabs a{padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;font-weight:700;color:var(--cinza);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current]{color:var(--ink);border-color:var(--acct)}
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:22px}
.bl{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:22px}
.bl h3{margin:0 0 4px;font-size:18px}.bl .cap{color:var(--cinza);font-size:14px;margin:0 0 14px}
.span2{grid-column:1/-1}
.faixa{display:flex;gap:6px;margin:6px 0 10px}.faixa span{flex:1;height:10px;border-radius:6px;background:var(--linha)}
.faixa span.on{background:var(--azul)}.faixa span.agora{background:var(--coral)}
.mt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--linha)}
.mt:first-of-type{border-top:0}
.mt b{font-size:15px}.mt .v{font-weight:800;white-space:nowrap;text-align:right}
.mt .bar{grid-column:1/-1;height:10px;border-radius:6px;background:var(--azul-c);overflow:hidden}.mt .bar i{display:block;height:100%;border-radius:6px}
.graf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.graf .bl{min-width:0}.graf h3{margin:0}.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--azul-c);margin-top:14px}.stk i{display:block;height:100%}.leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--cinza);margin-top:12px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px;margin-top:12px}.hb .bar{grid-column:1/-1;height:8px;border-radius:6px;background:var(--azul-c);overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:6px}.hb b{font-weight:600}.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:130px;margin-top:16px;border-bottom:1px solid var(--linha)}.cols div{display:flex;gap:2px;align-items:end;height:100%}.cols span{flex:1;border-radius:3px 3px 0 0;min-height:2px}.mes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:11px;color:var(--cinza);text-align:center;margin-top:6px}.big{font-size:34px;font-weight:800;line-height:1.1;margin-top:12px;display:block}
@media (max-width:760px){.graf{grid-template-columns:minmax(0,1fr)}}
.mt small{color:var(--cinza);grid-column:1/-1;font-size:13px}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;white-space:nowrap}
.sem:before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.s-ok{color:light-dark(#0E7A4B,#5BD69A)}.s-at{color:light-dark(#A15C00,#FFC266)}.s-fo{color:light-dark(#C0202D,#FF8A92)}
.ac{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--linha);font-size:15px}
.ac:first-of-type{border-top:0}.ac div{flex:1}.ac small{display:block;color:var(--cinza);font-size:13px}
.ac .d{white-space:nowrap;font-weight:700;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:16px}
.kpi b{display:block;font:800 clamp(26px,3vw,34px)/1 Montserrat,system-ui,sans-serif;letter-spacing:-.02em;margin-bottom:6px}.kpi span{font-size:13px;color:var(--cinza)}
.ben{background:var(--azul);color:#fff;border:0}.ben .cap{color:rgba(255,255,255,.8)}.ben p{margin:0 0 12px}
.vazio{border-style:dashed;background:transparent}.vazio p{color:var(--cinza);margin:0}
.prox{background:var(--azul);color:#fff;border:0;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prox h3{font-size:22px}.prox .cap{color:rgba(255,255,255,.85);margin:0}
.ficticio{font-size:13px;color:var(--cinza);margin-top:14px}
@media(max-width:860px){.dash{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center;opacity:.9}
.top nav a:hover{background:rgba(255,255,255,.12)}
.top a.cta{background:var(--coral);color:#381A56;font-weight:800;padding:8px 18px;border-radius:999px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.hero{background:var(--azul);color:#fff}
.hero .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,5vw,64px);align-items:center;min-height:min(640px,calc(100vh - 64px))}
.hero .lock{width:min(100%,400px);display:block;margin-bottom:18px}
.hero p.sub{font-size:19px;opacity:.92;max-width:36ch;margin:14px 0 24px}
.hero .bts{display:flex;gap:12px;flex-wrap:wrap}
.btn.w{background:rgba(255,255,255,.14);color:#fff}
.mock{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 34px 70px rgba(30,10,50,.45);transform:rotate(-1.5deg)}
.mock .mt{padding:9px 0}.mock h3{margin:0 0 8px;font-size:16px}
.mock .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.mock .row span{font-size:12px;color:var(--cinza)}
.sec h2{margin-bottom:10px}.sec .lead{color:var(--cinza);font-size:18px;max-width:60ch;margin:0 0 26px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.it{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:22px}
.it b{display:block;font-size:18px;margin-bottom:6px}.it p{margin:0;color:var(--cinza)}
.passos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:f}
.passo{background:var(--card);border:1px solid var(--linha);border-radius:20px;padding:18px;position:relative}
.passo:before{counter-increment:f;content:counter(f);font:800 15px Montserrat,system-ui,sans-serif;color:var(--acct);width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--coral) 15%,transparent);display:grid!important;place-items:center;display:block;margin-bottom:6px}
.passo b{display:block;margin-bottom:4px}.passo p{margin:0;font-size:14px;color:var(--cinza)}
.alt{background:var(--azul-c)}
.benb{background:var(--azul-e);color:#fff}.benb .lead{color:rgba(255,255,255,.85)}
.benb .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,60px);align-items:center}
.chat{display:grid;gap:10px}.msg{padding:14px 16px;border-radius:18px;max-width:92%;font-size:15px}
.msg.u{background:rgba(255,255,255,.14);justify-self:end;border-bottom-right-radius:6px}
.msg.b{background:#fff;color:#381A56;border-bottom-left-radius:6px}.msg.b small{display:block;font-weight:800;color:var(--azul);margin-bottom:4px}
.planos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.plano{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.plano.rec{border:2px solid var(--azul)}
.plano h3{margin:0;font-size:20px}.plano .pr{font:800 clamp(26px,2.6vw,32px)/1.05 Montserrat,system-ui,sans-serif;letter-spacing:-.02em;color:var(--azul)}
:root[data-theme=dark] .plano .pr{color:#D9F301}
.plano .pr small{font:600 13px Montserrat,sans-serif;color:var(--cinza);display:block;margin-top:4px}
.plano ul{margin:0;padding-left:18px;font-size:15px;flex:1}.plano .btn{width:100%}
.faq details{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:14px 18px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer;min-height:28px}.faq p{margin:10px 0 0;color:var(--cinza)}
footer.rod{background:var(--azul-e);color:#fff;padding:36px max(5vw,16px)}
footer.rod .in{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer.rod svg{width:120px}footer.rod p{margin:0;opacity:.8;font-size:14px}
.login{background:var(--azul);min-height:calc(100vh - 64px);display:grid;place-items:center;padding:40px 16px}
.login .box{width:min(100%,440px)}
.login label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.login input{width:100%;font:16px inherit;font-family:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--linha);background:var(--bg);color:var(--ink);min-height:48px}
.login input:focus{outline:3px solid var(--acct);outline-offset:1px}
.login .btn{width:100%;margin-top:18px}
.login .lk{display:flex;justify-content:space-between;font-size:14px;margin-top:12px;color:var(--cinza)}
.orglogo{height:44px;width:auto;display:block}
.logobox{background:#fff;border-radius:14px;padding:6px 10px;display:grid;place-items:center;flex:none}
.cab .logobox{height:74px;padding:8px 14px}.cab .logobox img{height:58px}
.org .logobox{height:44px;padding:4px 8px}.org .logobox img{height:36px}
@media(max-width:900px){.planos{grid-template-columns:repeat(2,minmax(0,1fr))}.passos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hero .in,.benb .in{grid-template-columns:minmax(0,1fr)}.top nav{display:none}.mock{transform:none}}
@media(max-width:520px){.planos,.passos{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(36px,4.4vw,54px)}
.hero .lock{width:min(100%,220px)!important;margin-bottom:26px!important}
.ctas2{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lnk{color:inherit;font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.lnk:hover{text-decoration:underline}
.origem{background:var(--azul-e);color:#fff;padding:18px max(5vw,16px);font-size:15px}
.origem .in{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.origem img{height:34px;background:#fff;border-radius:10px;padding:4px 8px}
.grupos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grupo{background:var(--card);border:1px solid var(--linha);border-radius:24px;padding:26px}
.grupo h3{font-size:21px;margin-bottom:4px}.grupo>p{color:var(--cinza);margin:0 0 16px;font-size:15px}
.grupo ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.grupo li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:15px}
.grupo li:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acct);margin-top:7px}
.grupo li b{display:block;font-weight:700}.grupo li span{color:var(--cinza)}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(20px,3vw,36px) 0}
.feat+.feat{border-top:1px solid var(--linha)}
.feat.inv .tx{order:2}
.feat h3{font-size:clamp(22px,2.4vw,28px);margin-bottom:10px}.feat .tx p{color:var(--cinza);font-size:17px;margin:0 0 14px}
.feat ul{margin:0;padding-left:18px;color:var(--ink)}
.ui{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:20px;box-shadow:0 20px 44px rgba(56,26,86,.10)}
.ui .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.ui .hd span{font-size:12px;color:var(--cinza);font-weight:600}
.tg{display:inline-flex;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--azul-c)}

.ok{background:var(--azul-c);border-radius:14px;padding:14px;font-weight:600}

@media(max-width:760px){.feat,.final .in{grid-template-columns:minmax(0,1fr)}.feat.inv .tx{order:0}}
.tabs{overflow-x:auto;flex-wrap:nowrap}.tabs a{flex:none}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 6px}
.tool .sp{flex:1}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:12px}
.btn.lk{background:transparent;color:var(--cinza);text-decoration:underline}
.grp{margin-top:24px}.grp>h3{font-size:16px;color:var(--cinza);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.card .t{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.card .t b{font-size:16px}.card .meta{color:var(--cinza);font-size:14px;margin-top:4px}
.card details{margin-top:10px}.card summary{cursor:pointer;font-weight:700;color:var(--azul);font-size:14px;min-height:30px}
:root[data-theme=dark] .card summary{color:#D9F301}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px;align-items:end}
.fm label{display:grid;gap:4px;font-size:13px;font-weight:700}
.fm input,.fm select,.fm textarea{font:16px Montserrat,sans-serif;padding:9px 11px;border-radius:10px;border:1.5px solid var(--linha);background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.fm .w2{grid-column:1/-1}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--cinza)}
.hist li{padding:6px 0;border-top:1px dashed var(--linha)}
.orc{width:100%;border-collapse:collapse;font-size:15px}
.orc th,.orc td{padding:8px;border-bottom:1px solid var(--linha);text-align:right}
.orc th:first-child,.orc td:first-child{text-align:left}
.orc input{width:120px;text-align:right;font:15px Montserrat,sans-serif;padding:6px 8px;border-radius:8px;border:1.5px solid var(--linha);background:var(--bg);color:var(--ink);min-height:40px}
.aviso2{background:color-mix(in srgb,var(--coral) 12%,transparent);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:12px}
a:focus-visible,button:focus-visible{outline:3px solid var(--acct);outline-offset:2px}
@media(max-width:760px){.entrar .in{grid-template-columns:minmax(0,1fr)}.trilha .tp span{font-size:11px}}

:root{--dado:light-dark(#381A56,#D9F301);--fo:light-dark(#C0392B,#FF7A6B);--vazio:light-dark(#DCD2E8,#3B2B4E);--trilho:light-dark(#EDE6F5,#33224A)}
.kpis .kpi b{color:var(--ink)}.kpi b small{font-size:.55em;color:var(--cinza);font-weight:700}.kpi .bar{margin-top:10px;height:8px;border-radius:6px;background:var(--trilho);overflow:hidden}.kpi .bar i{display:block;height:100%;border-radius:6px}.kpi em{font-style:normal;font-weight:700}
.kpi.kd{display:flex;align-items:center;gap:14px}.kpi.kd .dn{width:74px;height:74px;flex:none}.kpi.kd .dn-n{font-size:30px}
.dn{width:150px;height:150px;flex:none}.dn-n{font:800 28px Montserrat,sans-serif;fill:var(--ink)}.dn-s{font:600 13px Montserrat,sans-serif;fill:var(--cinza)}
.dw{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.dw .leg{flex-direction:column;gap:8px;margin:0;font-size:14px}.leg b{color:var(--ink)}
.graf .bl h3{font-size:19px;font-weight:800;color:var(--ink)}.graf .cap{margin:4px 0 14px}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ev{width:100%;height:auto;display:block}.ev .gl{stroke:var(--linha)}.ev .ax{font:600 12px Montserrat,sans-serif;fill:var(--cinza)}.ev .evb{fill:var(--trilho)}.ev .evl{fill:none;stroke:var(--dado);stroke-width:3;stroke-linejoin:round}.ev .evp{fill:var(--dado);stroke:var(--card);stroke-width:2}.ev .evt{font:800 13px Montserrat,sans-serif;fill:var(--ink)}
.vz{color:var(--cinza);font-size:14px;margin:6px 0 0}.vz a{color:var(--acct);font-weight:700}
.aviso-ex{margin-top:22px;background:var(--trilho);border-color:transparent;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}.chip{display:flex;gap:12px;align-items:flex-start;background:var(--trilho);border-radius:14px;padding:14px}.chip b{display:block;font-size:15px}.chip small{color:var(--cinza);font-size:13px}.nn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--dado);color:light-dark(#fff,#21132F);display:grid;place-items:center;font-weight:800}
.graf .ac b{font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}:root:not([data-theme=light]) .pill{color:#D9F301}:root:not([data-theme=light]) .btn.s{color:#D9F301}:root:not([data-theme=light]) .plano .pr{color:#D9F301}:root:not([data-theme=light]) .card summary{color:#D9F301}}

.menu{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--linha);flex-wrap:wrap;align-items:flex-end;position:relative;z-index:5}
.menu .mi{padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--cinza);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu .mi[aria-current],.menu .mi.on{color:var(--ink);border-color:var(--acct)}
.menu .mi:hover{color:var(--ink)}.menu .sh{display:none}
.dd{position:relative}.dd .pop{position:absolute;top:calc(100% + 6px);left:0;min-width:290px;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:8px;box-shadow:0 18px 40px rgba(20,8,35,.22);display:grid;gap:2px}
.dd .pop a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink)}.dd .pop a:hover,.dd .pop a[aria-current]{background:var(--trilho)}
.dd .pop b{display:block;font-size:15px}.dd .pop a.sub{padding:7px 12px 7px 24px}.dd .pop a.sub b{font-size:14px;font-weight:600}.dd .pop{max-height:calc(100vh - 120px);overflow-y:auto}.dd .pop small{display:block;color:var(--cinza);font-size:13px;margin-top:2px}
@media (max-width:640px){.menu .lg{display:none}.menu .sh{display:inline}.menu{flex-wrap:nowrap;gap:0}.menu .mi{padding:8px 9px;font-size:14px;min-height:40px}.kpi.kd{flex-direction:column;align-items:flex-start}.dd .pop{position:fixed;left:12px;right:12px;top:auto;min-width:0}}
.planbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:18px 0 12px}
.planbar .st{font-size:13px;color:var(--cinza)}
#planf{width:100%;height:calc(100vh - 230px);min-height:480px;border:1px solid var(--linha);border-radius:18px;background:#fff;display:block}
.rel h2{font-size:26px;margin:0 0 4px}.rel .sec{margin-top:22px}.rel table{width:100%;border-collapse:collapse;font-size:14px}.rel td,.rel th{padding:8px 6px;border-top:1px solid var(--linha);text-align:left;vertical-align:top}.rel th{color:var(--cinza);font-weight:700}
@media print{header.top,.menu,.cab,.noprint,.planbar{display:none!important}body{background:#fff}.band{padding:0!important}.bl,.kpi{break-inside:avoid;border-color:#ddd}}

 <section class="band sec" id="plataforma"><div class="in"><span class="eyebrow">Plataforma</span><h2>Estratégia e execução no mesmo sistema</h2><p class="lead">Ferramentas de gestão de pessoas não fazem planejamento. Planilhas não acompanham ninguém. A RUMMO junta os dois: o plano nasce aqui e é acompanhado aqui, todo mês.</p>
 <div class="g3"><div class="it"><b>Guiado do começo ao fim</b><p>Perguntas simples, uma etapa por vez, e rascunhos do Ben para a equipe escolher e editar.</p></div><div class="it"><b>Feito para o terceiro setor</b><p>Metas por perspectiva, papéis claros, orçamento ligado ao plano e documentos para conselho e financiadores.</p></div><div class="it"><b>O plano sai da gaveta</b><p>Check-ins mensais, semáforo e resumo do mês mostram o que está no rumo e o que precisa de atenção.</p></div></div></div></section>
 <section class="band sec alt" id="funcionalidades"><div class="in"><span class="eyebrow">Funcionalidades</span><h2>Tudo o que sua organização precisa, em três frentes</h2><p class="lead">Comece pela estratégia e libere as outras frentes quando estiver pronta.</p>
 <div class="grupos">${[['Estratégia','Onde queremos chegar',[['Missão, visão e valores','Com perguntas norteadoras e rascunhos do Ben'],['Diagnóstico','Forças, fraquezas, riscos e oportunidades'],['Metas e orçamento','Metas por perspectiva ligadas a receitas e despesas']]],['Execução','Como vamos chegar',[['Plano tático','Cada meta vira ações com responsável e prazo'],['Check-ins de metas','Atualização mensal com semáforo'],['Painel da diretoria','Tudo o que importa numa tela só']]],['Equipe','Quem faz acontecer',[['Papéis','Quem responde pelo quê, sem sobreposição'],['Rotinas','1:1 com pauta e reunião de resultados'],['Avaliação','Opcional, ligada às metas e aos valores']]]].map(([t,d,its])=>`<div class="grupo"><h3>${t}</h3><p>${d}</p><ul>${its.map(([a,b])=>`<li><div><b>${a}</b><span>${b}</span></div></li>`).join('')}</ul></div>`).join('')}</div></div></section>

 <div class="feat"><div class="tx"><span class="eyebrow">Plano tático</span><h3>Da meta à ação da semana</h3><p>Cada meta se desdobra em ações com responsável, prazo e status. Quem atrasou aparece antes de virar problema.</p></div>
 <div class="ui"><div class="hd">Ações da semana <span>Exemplo</span></div>${[['Enviar proposta ao edital','Coordenação','fo','Atrasada'],['Relatório aos parceiros','Financeiro','at','30/11'],['Abrir turma de audiovisual','Pedagógico','ok','02/12']].map(([n,r,st,d])=>`<div class="ac"><div>${n}<small>${r}</small></div><span class="d ${SN[st][0]}">${d}</span></div>`).join('')}</div></div>
 <div class="feat inv"><div class="tx"><span class="eyebrow">Acompanhamento</span><h3>Check-in mensal em dois minutos</h3><p>O responsável atualiza o número, escolhe o semáforo e deixa um comentário. O painel da diretoria se atualiza sozinho.</p></div>

async function iniciarPlan(id){

 if(PLAN&&PLAN.timer){clearInterval(PLAN.timer)}PLAN={id,ult:{}};
 try{
  const kr=await SB.from('segredos').select('valor').eq('org_id',id).eq('nome','chave_planejamento').maybeSingle();
  if(!kr.data)throw new Error('sem chave');
  const raw=Uint8Array.from(atob(kr.data.valor),c=>c.charCodeAt(0)),key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const bin=new Uint8Array(await (await fetch('/planejamento.bin',{cache:'no-cache'})).arrayBuffer());
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin.slice(0,12)},key,bin.slice(12));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const rows=await SB.from('planejamento').select('chave,valor').eq('org_id',id);
  (rows.data||[]).forEach(r=>{try{localStorage.setItem(r.chave,r.valor);PLAN.ult[r.chave]=r.valor}catch(e){}});

 }catch(e){if(st())st().textContent='Não consegui abrir o planejamento. Recarregue a página e tente de novo.'}
}

function menuHtml(id,aba){return `<nav class="menu" aria-label="Seções">${MENU.map(([k,l])=>{if(!Array.isArray(l))return `<a class="mi" href="#${id}"${aba===k?' aria-current="page"':''}>${l}</a>`;const on=l.some(x=>x[0].split(':')[0]===aba);return `<details class="dd"><summary class="mi${on?' on':''}"><span class="lg">${k}</span><span class="sh">${({Planejamento:'Planejar',Acompanhamento:'Acompanhar'})[k]||k}</span> <span aria-hidden="true">▾</span></summary><div class="pop">${l.map(([kk,ll,dd])=>{const [ab,st]=kk.split(':');return `<a href="#${id}-${ab}"${st?` data-step="${st}"`:''}${aba===kk?' aria-current="page"':''}${st?' class="sub"':''}><b>${ll}</b><small>${dd}</small></a>`}).join('')}</div></details>`}).join('')}</nav>`}
document.addEventListener('click',e=>{document.querySelectorAll('details.dd[open]').forEach(d=>{if(!d.contains(e.target)||e.target.closest('.pop a'))d.open=false})});
document.addEventListener('toggle',e=>{if(!(e.target.matches&&e.target.matches('details.dd')&&e.target.open))return;document.querySelectorAll('details.dd[open]').forEach(d=>{if(d!==e.target)d.open=false});const pop=e.target.querySelector('.pop');if(innerWidth<=640)pop.style.top=(e.target.querySelector('summary').getBoundingClientRect().bottom+6)+'px';else pop.style.top=''},true);
addEventListener('scroll',()=>{if(innerWidth<=640)document.querySelectorAll('details.dd[open]').forEach(d=>d.open=false)},{passive:true});
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const STO=[['nao_iniciada','Não iniciada'],['no_rumo','No rumo'],['atencao','Atenção'],['fora_do_rumo','Fora do rumo'],['concluida','Concluída']];
const optS=v=>STO.map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('');
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
function salvar(D,id){id=id||CUR;D.acompanhamentoGeradoEm=new Date().toISOString();
 if(REMOTO.includes(id)){MEM[id]=JSON.parse(JSON.stringify(D));if(SB&&SESS)SB.from('acompanhamento').upsert({org_id:id,dados:D,atualizado_em:new Date().toISOString(),atualizado_por:SESS.user.id}).then(({error})=>{if(error)alertaErro()});return}
 try{localStorage.setItem(KIMP(id),JSON.stringify(D))}catch(e){alertaErro()}}
function alertaErro(){const el=document.getElementById('err');if(el)el.textContent='Não consegui salvar. Confira a internet e tente de novo.'}
function vazio(id){const o=ORGS[id];return {formato:'rummo.acompanhamento',versao:1,geradoEm:new Date().toISOString(),origem:'RUMMO',org:{id,nome:o.nome},ciclo:2027,prioridades:[],metas:[],acoes:[],rituais:[],radar:[],orcamento:{total:0,mensal:Array(12).fill(0),realizado:Array(12).fill(null)},documentos:[]}}
function semDados(id){return `<div class="bl span2 imp" style="margin-top:22px"><h3>Comece o acompanhamento</h3><p class="cap">Traga o que o planejamento gerou ou comece em branco. Os dados ficam salvos neste navegador.</p><div class="tool" style="margin:0"><label class="btn p" for="fimp" style="cursor:pointer">Importar do planejamento (.json)</label><input id="fimp" type="file" accept=".json,application/json" hidden><button class="btn s" data-act="branco">Começar em branco</button></div><p class="cap" style="margin:12px 0 0">No planejamento 2027: aba de documentos, botão "Enviar para a RUMMO".</p><p id="imperr" class="cap" style="margin:10px 0 0;color:var(--acct)"></p></div>`}
function barraFerr(){return `<div class="tool"><button class="btn s sm" data-act="exportar">Exportar (.json)</button><label class="btn s sm" for="fimp" style="cursor:pointer">Importar outro arquivo</label><input id="fimp" type="file" accept=".json,application/json" hidden><span class="sp"></span><button class="btn lk sm" data-act="zerar">Zerar acompanhamento</button><button class="btn lk sm" data-act="limpar">Apagar tudo</button></div><p id="err" class="cap" style="color:var(--acct);margin:0"></p>`}
function abaMetas(D){
 const g={};D.metas.forEach((m,i)=>{(g[m.perspectiva||'Sem perspectiva']=g[m.perspectiva||'Sem perspectiva']||[]).push([m,i])});
 const ult=m=>m.checkins&&m.checkins.length?m.checkins[m.checkins.length-1]:null;
 return barraFerr()+`<p class="cap">${D.metas.length} metas. Faça o check-in do mês em cada uma: o painel se atualiza sozinho.</p>`+Object.entries(g).map(([pp,ms])=>`<div class="grp"><h3>${esc(pp)}</h3>${ms.map(([m,i])=>{const u=ult(m);return `<div class="card"><div class="t"><div><b>${esc(m.indicador||m.titulo)}</b><div class="meta">${[m.titulo!==m.indicador?m.titulo:'',m.meta?'Meta: '+m.meta:'',m.responsavel,m.frequencia].filter(Boolean).map(esc).join(' · ')}</div></div>${stp(m.status)}</div>
 ${u?`<div class="meta">Último check-in ${esc(u.periodo)}: <b>${esc(u.valor??'')}</b>${u.comentario?' · '+esc(u.comentario):''}</div>`:''}
 <details><summary>Fazer check-in</summary><form class="fm" data-form="checkin" data-i="${i}"><label>Mês<select name="periodo">${MESES.map((x,k)=>`<option value="${D.ciclo||2027}-${String(k+1).padStart(2,'0')}">${x}/${D.ciclo||2027}</option>`).join('')}</select></label><label>Valor${m.unidade?' ('+esc(m.unidade)+')':''}<input name="valor" inputmode="decimal"></label><label>Status<select name="status">${optS(m.status==='nao_iniciada'?'no_rumo':m.status)}</select></label><label>Quem atualiza<input name="autor" value="${esc(m.responsavel||'')}"></label><label class="w2">Comentário<input name="comentario"></label><button class="btn p sm">Salvar check-in</button></form>
 ${m.checkins&&m.checkins.length?`<ul class="hist">${m.checkins.slice().reverse().map(c=>`<li>${esc(c.periodo)} · ${esc(c.valor??'')} · ${(STI[c.status]||['',''])[1]}${c.comentario?' · '+esc(c.comentario):''}${c.autor?' · '+esc(c.autor):''}</li>`).join('')}</ul>`:''}</details>
 <details><summary>Editar meta</summary><form class="fm" data-form="meta" data-i="${i}"><label class="w2">Indicador<input name="indicador" value="${esc(m.indicador||'')}"></label><label>Perspectiva<input name="perspectiva" value="${esc(m.perspectiva||'')}"></label><label>Meta (texto)<input name="meta" value="${esc(m.meta||'')}"></label><label>Base (número)<input name="baseNum" inputmode="decimal" value="${m.baseNum??''}"></label><label>Meta (número)<input name="metaNum" inputmode="decimal" value="${m.metaNum??''}"></label><label>Unidade<input name="unidade" value="${esc(m.unidade||'')}"></label><label>Responsável<input name="responsavel" value="${esc(m.responsavel||'')}"></label><label>Frequência<input name="frequencia" value="${esc(m.frequencia||'')}"></label><button class="btn s sm">Salvar meta</button><button type="button" class="btn lk sm" data-act="delmeta" data-i="${i}">Excluir meta</button></form></details></div>`}).join('')}</div>`).join('')+
 `<div class="card"><b>Nova meta</b><form class="fm" data-form="novameta"><label class="w2">Indicador<input name="indicador" required></label><label>Perspectiva<input name="perspectiva"></label><label>Meta (número)<input name="metaNum" inputmode="decimal"></label><label>Unidade<input name="unidade"></label><label>Responsável<input name="responsavel"></label><button class="btn p sm">Adicionar</button></form></div>`;
}
function abaAcoes(D){
 const hoje=new Date().toISOString().slice(0,10);
 return barraFerr()+`<p class="cap">${D.acoes.length} ações. Atualize o status direto na lista.</p>`+D.acoes.map((a,i)=>({a,i})).sort((x,y)=>(x.a.dataLimite||'9')<(y.a.dataLimite||'9')?-1:1).map(({a,i})=>{const at=a.status!=='concluida'&&a.dataLimite&&a.dataLimite<hoje;return `<div class="card"><div class="t"><div><b>${esc(a.acao)}</b><div class="meta">${[a.responsavel,a.evidencia].filter(Boolean).map(esc).join(' · ')}</div></div><span class="d ${at?'s-fo':''}" style="font-weight:700;font-size:14px">${at?'Atrasada · ':''}${dbr(a.dataLimite)}</span></div>
 <form class="fm" data-form="acao" data-i="${i}"><label>Status<select name="status" data-auto="1">${optS(a.status)}</select></label><label>Responsável<input name="responsavel" value="${esc(a.responsavel||'')}"></label><label>Prazo<input type="date" name="dataLimite" value="${esc(a.dataLimite||'')}"></label><button class="btn s sm">Salvar</button><button type="button" class="btn lk sm" data-act="delacao" data-i="${i}">Excluir</button></form></div>`}).join('')+
 `<div class="card"><b>Nova ação</b><form class="fm" data-form="novaacao"><label class="w2">Ação<input name="acao" required></label><label>Responsável<input name="responsavel"></label><label>Prazo<input type="date" name="dataLimite"></label><button class="btn p sm">Adicionar</button></form></div>`;
}
function abaRituais(D){
 return barraFerr()+`<p class="cap">Registre o que foi decidido em cada encontro.</p>`+D.rituais.map((r,i)=>`<div class="card"><div class="t"><div><b>${esc(r.nome)}</b><div class="meta">${[r.quando,r.duracao,r.conduz].filter(Boolean).map(esc).join(' · ')}</div></div><span style="font-weight:700;font-size:14px">Próximo: ${dbr(r.proximaData)||'a definir'}</span></div>
 ${Array.isArray(r.pauta)&&r.pauta.length?`<div class="meta">Pauta: ${r.pauta.map(esc).join(' · ')}</div>`:''}
 <details><summary>Registrar encontro</summary><form class="fm" data-form="registro" data-i="${i}"><label>Data<input type="date" name="data" value="${new Date().toISOString().slice(0,10)}"></label><label>Quem registra<input name="autor"></label><label>Próximo encontro<input type="date" name="proxima" value="${esc(r.proximaData||'')}"></label><label class="w2">O que foi decidido<textarea name="texto" rows="3"></textarea></label><button class="btn p sm">Salvar registro</button></form>
 ${Array.isArray(r.registros)&&r.registros.length?`<ul class="hist">${r.registros.slice().reverse().map(x=>`<li>${dbr(x.data)} · ${esc(x.texto)}${x.autor?' · '+esc(x.autor):''}</li>`).join('')}</ul>`:''}</details></div>`).join('')+
 `<div class="card"><b>Novo ritual</b><form class="fm" data-form="novorit"><label class="w2">Nome<input name="nome" required></label><label>Quando<input name="quando"></label><label>Próximo encontro<input type="date" name="proximaData"></label><button class="btn p sm">Adicionar</button></form></div>`;
}
function abaOrc(D){
 const o=D.orcamento=D.orcamento||{};o.mensal=Array.isArray(o.mensal)?o.mensal:Array(12).fill(0);o.realizado=Array.isArray(o.realizado)?o.realizado:Array(12).fill(null);
 let ap=0,ar=0;
 return barraFerr()+`<p class="cap">Lance o planejado e o realizado de cada mês. O gráfico e o desvio aparecem no painel.</p><div class="card scroll"><form data-form="orc"><table class="orc"><thead><tr><th>Mês</th><th>Planejado</th><th>Realizado</th><th>Desvio</th></tr></thead><tbody>${MESES.map((m,k)=>{const p=o.mensal[k]||0,r=o.realizado[k];if(typeof r==='number'){ap+=p;ar+=r}const dv=typeof r==='number'&&p?Math.round((r-p)/p*100):null;return `<tr><td>${m}</td><td><input name="p${k}" inputmode="decimal" value="${p||''}" aria-label="Planejado ${m}"></td><td><input name="r${k}" inputmode="decimal" value="${r??''}" aria-label="Realizado ${m}"></td><td class="${dv===null?'':Math.abs(dv)>10?'s-fo':'s-ok'}">${dv===null?'':(dv>0?'+':'')+dv+'%'}</td></tr>`}).join('')}</tbody><tfoot><tr><th>Total</th><th>${brl(o.mensal.reduce((a,b)=>a+(b||0),0))}</th><th>${brl(ar)}</th><th>${ap?((ar-ap)/ap*100>0?'+':'')+Math.round((ar-ap)/ap*100)+'%':''}</th></tr></tfoot></table><button class="btn p sm" style="margin-top:12px">Salvar orçamento</button></form></div>`;
}
function espaco(id,aba){
 if(REMOTO.includes(id)&&!SESS){location.hash='entrar';return}
 if(REMOTO.includes(id)&&!MINHAS.includes(id)){modo('login');app.innerHTML=caixaLogin(`<h3>Sem acesso</h3><p class="cap">Seu login não tem acesso a esta organização. Fale com quem administra a conta.</p><button class="btn s" onclick="sairConta()">Sair</button>`);return}
 modo('app');CUR=id;const o=ORGS[id];quem.textContent=SESS&&REMOTO.includes(id)?SESS.user.email:o.nome;sair.hidden=false;sair.textContent=SESS?'Sair':'Trocar organização';document.title='RUMMO: '+o.nome;
 const D=lerImp(id);let corpo;
 if(aba==='fases')corpo=fasesHtml(id,o);
 else if(aba==='planejamento')corpo=abaPlan(id);
 else if(aba==='ben')corpo=abaBen(id);
 else if(aba==='relatorio')corpo=D?abaRel(id,o,D):semDados(id);
 else if(!aba)corpo=painel(id,o);
 else if(!D)corpo=semDados(id);
 else corpo={metas:abaMetas,acoes:abaAcoes,rituais:abaRituais,orcamento:abaOrc}[aba](D);
 app.innerHTML=`<section class="band"><div class="in">
 <div class="cab">${marcaOrg(o,id)}<div><h1>${esc(o.nome)}</h1><p>${esc(o.desc)}</p></div></div>
 ${menuHtml(id,aba||'')}
 ${corpo}</div></section>`;
 if(aba==='planejamento'){app.querySelector('.cab').style.display='none';iniciarPlan(id)}
}
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n};
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f||!CUR)return;e.preventDefault();
 const D=lerImp(CUR)||vazio(CUR),v=Object.fromEntries(new FormData(f)),i=+f.dataset.i,k=f.dataset.form;
 if(k==='checkin'){const m=D.metas[i];m.checkins=m.checkins||[];const c={periodo:v.periodo,valor:num(v.valor),status:v.status,comentario:v.comentario.trim(),autor:v.autor.trim(),em:new Date().toISOString()};m.checkins=m.checkins.filter(x=>x.periodo!==c.periodo);m.checkins.push(c);m.checkins.sort((a,b)=>a.periodo<b.periodo?-1:1);m.status=m.checkins[m.checkins.length-1].status}
 if(k==='meta'){const m=D.metas[i];['indicador','perspectiva','meta','unidade','responsavel','frequencia'].forEach(x=>m[x]=v[x].trim());m.baseNum=num(v.baseNum);m.metaNum=num(v.metaNum)}
 if(k==='novameta')D.metas.push({id:uid('meta'),tipo:'indicador',titulo:v.indicador.trim(),indicador:v.indicador.trim(),perspectiva:v.perspectiva.trim(),metaNum:num(v.metaNum),baseNum:null,unidade:v.unidade.trim(),meta:'',responsavel:v.responsavel.trim(),frequencia:'Mensal',status:'nao_iniciada',checkins:[]});
 if(k==='acao'){const a=D.acoes[i];a.status=v.status;a.responsavel=v.responsavel.trim();a.dataLimite=v.dataLimite}
 if(k==='novaacao')D.acoes.push({id:uid('ac'),acao:v.acao.trim(),responsavel:v.responsavel.trim(),dataLimite:v.dataLimite,status:'nao_iniciada'});
 if(k==='registro'){const r=D.rituais[i];r.registros=r.registros||[];if(v.texto.trim())r.registros.push({data:v.data,texto:v.texto.trim(),autor:v.autor.trim()});if(v.proxima)r.proximaData=v.proxima}
 if(k==='novorit')D.rituais.push({id:uid('rit'),nome:v.nome.trim(),quando:v.quando.trim(),proximaData:v.proximaData,registros:[]});
 if(k==='orc'){D.orcamento.realizado=MESES.map((_,j)=>num(v['r'+j]));D.orcamento.mensal=MESES.map((_,j)=>num(v['p'+j])||0);D.orcamento.total=D.orcamento.mensal.reduce((a,b)=>a+b,0)}
 salvar(D);const y=scrollY;rota();scrollTo(0,y);
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.auto)e.target.form.requestSubmit()});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||!CUR)return;const act=b.dataset.act,i=+b.dataset.i;let D=lerImp(CUR);
 if(act==='branco'){salvar(vazio(CUR));rota();return}
 if(act==='exportar'&&D){const bl=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=`rummo-${CUR}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();return}
 if(act==='zerar'&&D){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Clique de novo para zerar check-ins, status, registros e realizado';return}D.metas.forEach(m=>{m.checkins=[];m.status='nao_iniciada'});D.acoes.forEach(a=>a.status='nao_iniciada');D.rituais.forEach(r=>r.registros=[]);if(D.orcamento){D.orcamento.realizado=Array(12).fill(null);if(D.exemplo){D.orcamento.mensal=Array(12).fill(0);D.orcamento.total=0}}delete D.exemplo;salvar(D);rota();return}
 if(act==='limpar'){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Clique de novo para apagar tudo deste navegador';return}salvar(vazio(CUR));location.hash=CUR;rota();return}
 if(!D)return;
 if(act==='delmeta'){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Clique de novo para excluir';return}D.metas.splice(i,1)}
 if(act==='delacao'){if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Clique de novo para excluir';return}D.acoes.splice(i,1)}
 if(act==='delmeta'||act==='delacao'){salvar(D);const y=scrollY;rota();scrollTo(0,y)}
});
const SECS=['plataforma','funcionalidades','fases-site','planos','rede','comecar'];
function rota(){const h=location.hash.slice(1);if(SECS.includes(h)){if(!document.getElementById(h))site();document.getElementById(h).scrollIntoView();return}if(h==='entrar')return login(),scrollTo(0,0);let b=h,aba='';for(const [k] of ABAS){if(k&&h.endsWith('-'+k)){b=h.slice(0,-(k.length+1));aba=k}}ORGS[b]?espaco(b,aba):site();scrollTo(0,0)}
async function sairConta(){if(SB&&SESS)await SB.auth.signOut();SESS=null;MINHAS=[];Object.keys(MEM).forEach(k=>delete MEM[k]);if(location.hash==='#entrar')login();else location.hash='entrar'}
sair.onclick=()=>{if(SESS)sairConta();else location.hash='entrar'};
addEventListener('hashchange',()=>{if(/access_token|error_code/.test(location.hash))return;rota()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||!SB||!SESS||!CUR||!REMOTO.includes(CUR))return;const r=await SB.from('acompanhamento').select('dados').eq('org_id',CUR).maybeSingle();if(r.data){MEM[CUR]=r.data.dados;if(location.hash==='#'+CUR)rota()}});
(async()=>{
 const h=location.hash,tipo=(h.match(/type=([a-z]+)/)||[])[1],erro=/error_code=/.test(h);
 if(SB){SB.auth.onAuthStateChange((ev,se)=>{SESS=se;if(ev==='PASSWORD_RECOVERY')novaSenha()});try{await carregar()}catch(e){}}
 if(/access_token|error_code|type=/.test(h))history.replaceState(null,'',location.pathname+(erro?'#entrar':''));
 if(erro)return login('Esse link expirou ou já foi usado. Digite seu e-mail e clique em "Esqueci a senha" para receber outro.');
 if(tipo==='invite'||tipo==='recovery')return novaSenha();
 rota();
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script></body></html>
